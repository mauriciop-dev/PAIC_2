version: '3.8'

services:
  gran-hermano:
    build:
      context: ./agents/gran-hermano
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
    restart: unless-stopped

  sre-agent:
    build:
      context: ./agents/sre-agent
      dockerfile: Dockerfile
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - GRAN_HERMANO_URL=http://gran-hermano:3001
      - AGENT_ID=sre-agent-001
    depends_on:
      - gran-hermano
    restart: unless-stopped

  shadow-qa-agent:
    build:
      context: ./agents/shadow-qa-agent
      dockerfile: Dockerfile
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - GRAN_HERMANO_URL=http://gran-hermano:3001
      - AGENT_ID=shadow-qa-agent-001
    depends_on:
      - gran-hermano
    restart: unless-stopped

  shadow-security-agent:
    build:
      context: ./agents/shadow-security-agent
      dockerfile: Dockerfile
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - GRAN_HERMANO_URL=http://gran-hermano:3001
      - AGENT_ID=shadow-security-agent-001
    depends_on:
      - gran-hermano
    restart: unless-stopped

  user-habits-agent:
    build:
      context: ./agents/user-habits-agent
      dockerfile: Dockerfile
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - GRAN_HERMANO_URL=http://gran-hermano:3001
      - AGENT_ID=user-habits-agent-001
    depends_on:
      - gran-hermano
    restart: unless-stopped
